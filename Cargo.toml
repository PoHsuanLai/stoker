[workspace]
resolver = "3"
members = [
  "crates/cua-action",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/stoker"
publish = false

[workspace.dependencies]
cua-action          = { path = "crates/cua-action" }

# From quire's pinned block (`docs/workspace-deps.toml`) and the adopted lines of SPEC.md 1.4,
# copied verbatim: only the lines stoker names itself.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
keyboard-types = { version = "0.7", features = ["serde"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
