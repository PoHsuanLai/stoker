[workspace]
resolver = "3"
members = [
  "crates/cua-action",
  "crates/vision-prep",
  "crates/model-provider",
  "crates/cua-parse",
  "crates/cua-vendors",
  "crates/cua-session",
  "crates/model-replay",
  "crates/model-catalog",
  "crates/engine-supervisor",
  "crates/model-http",
  "crates/model-wire",
  "crates/model-extract",
  "crates/genai-names",
  "crates/model-openai-compat",
  "crates/speech-provider",
  "crates/speech-vad",
  "crates/speech-host-client",
  "crates/speech-host",
  "crates/engine-spec",
  "crates/engine-manifest",
  "crates/engine-probe",
  "crates/engine-install",
]
# Skeletons that need an inference runtime outside the pinned block. They are built on their own
# (`cargo build --manifest-path crates/<name>/Cargo.toml`), the way almanac excludes
# recall-fastembed; `deny.toml` leaves them out of its graph too.
exclude = [
  "crates/speech-vad-silero",
  "crates/speech-host-sherpa",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire declares; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/stoker"
publish = false

[workspace.dependencies]
cua-action          = { path = "crates/cua-action" }
vision-prep         = { path = "crates/vision-prep" }
model-provider      = { path = "crates/model-provider" }
cua-parse           = { path = "crates/cua-parse" }
cua-vendors         = { path = "crates/cua-vendors" }
cua-session         = { path = "crates/cua-session" }
model-replay        = { path = "crates/model-replay" }
model-catalog       = { path = "crates/model-catalog" }
engine-supervisor   = { path = "crates/engine-supervisor" }
model-http          = { path = "crates/model-http" }
model-wire          = { path = "crates/model-wire" }
model-extract       = { path = "crates/model-extract" }
genai-names         = { path = "crates/genai-names" }
model-openai-compat = { path = "crates/model-openai-compat" }
speech-provider     = { path = "crates/speech-provider" }
speech-vad          = { path = "crates/speech-vad" }
speech-host-client  = { path = "crates/speech-host-client" }
speech-host         = { path = "crates/speech-host" }
engine-spec         = { path = "crates/engine-spec" }
engine-manifest     = { path = "crates/engine-manifest" }
engine-probe        = { path = "crates/engine-probe" }
engine-install      = { path = "crates/engine-install" }

# From quire's pinned block (`docs/workspace-deps.toml`) and the adopted lines of SPEC.md 1.4,
# copied verbatim: only the lines stoker names itself.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
toml = "1"
keyboard-types = { version = "0.7", features = ["serde"] }
base64 = "0.22"
proptest = "1"
zeroize = "1"
# model-provider's `Money`: an exact decimal amount and an ISO 4217 currency (both MIT, which deny.toml allows).
rust_decimal = { version = "1", default-features = false, features = ["std", "serde"] }
iso_currency = { version = "0.7", features = ["with-serde"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6.1.0"
blake3 = "1"
# model-http's client behind its `client` feature. reqwest is the one HTTP client (owner,
# 2026-10-28): no default features, so no aws-lc and no system proxy; `model-http`'s `tls` feature
# adds rustls without a provider, and ring is installed through the `rustls` line below.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "process"] }
reqwest = { version = "0.13", default-features = false }
# model-http's `tls` feature: rustls with the ring provider only (no aws-lc, no OpenSSL); the
# platform roots come from reqwest's platform verifier (never webpki-roots, which is MPL).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# model-http's TLS tests run a rustls server on loopback.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

# engine-manifest and engine-probe: the SHA-256 of a file and of a tree seal (as porter pinned it).
sha2 = "0.10"
# engine-install unpacks the pinned engine archives (`tar.gz`) in process instead of running the
# system's `tar` (both MIT OR Apache-2.0). flate2 is already in Cargo.lock through png; tar's
# `xattr` default is off, nothing reads extended attributes.
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
# engine-install: free space on the file system holding an install (statvfs).
rustix = { version = "1.1", default-features = false, features = ["std", "fs"] }
# engine-install's `PinnedUrl` (https only) is parsed with url (already in Cargo.lock through reqwest).
url = "2"
# Scratch directories for tests.
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
