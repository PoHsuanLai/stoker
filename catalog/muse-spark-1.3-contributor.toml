# Muse Spark 1.3 (contributor), Meta's multimodal reasoning model in its contributor tier, a hosted model reached through the provider below. Facts checked on 2026-10-09.
#
# DATA USE, READ FIRST: this tier is the discounted one, and the price is the trade for the data. The OpenRouter page for the model says "Prompts and outputs may be used to improve Meta's products" (https://openrouter.ai/meta/muse-spark-1.3-contributor, read 2026-10-09). A write-up quoting Meta's pricing page says the tier is "heavily discounted token pricing in exchange for permission to use your prompts and completions to train future Meta models", and the standard tier says prompts are not used to train Meta models (https://www.llmreference.com/provider/openrouter/muse-spark-1.3-contributor, read 2026-10-09). That training wording is secondhand: I did not find it on Meta's own pages (https://dev.meta.ai/resources/blog/build-with-muse-spark/ has only the standard $1.25 / $4.25 price). Treat it as: prompts may be used for training. Only fake or synthetic test data may be sent to this entry. Real prompts, client data, personal data or secrets go to the standard tier, muse-spark-1.3 (a different id), which is not in this catalogue.
#
# - OpenRouter: https://openrouter.ai/api/v1/models and https://openrouter.ai/api/v1/models/meta/muse-spark-1.3-contributor/endpoints, read 2026-10-09: id meta/muse-spark-1.3-contributor (canonical meta/muse-spark-1.3-contributor-20260902), context 1048576, max completion 943718, $0.0000001 / $0.0000002 per token (100000 / 200000 micro-USD per MTok). Single endpoint (Meta). Listed parameters include tools, tool_choice, response_format, structured_outputs, reasoning. Reasoning is mandatory (default effort medium). Input modalities listed: text, image, video, file. Only image is written below: the catalogue has no video or file modality.
# - Streaming: https://openrouter.ai/docs/api/reference/streaming, read 2026-10-09: "The OpenRouter API allows streaming responses from any model."
# - Standard Muse Spark 1.3 for comparison, same OpenRouter listing: $1.25 / $4.25 per MTok (not used here).
# - Meta's direct Model API is not written: its model id and base URL were not confirmed on the pages read.
# - image_in: the pages give no per-request image limits, so this claims one image, no resizing and the image's own pixels as its space: a floor, not a limit.
# - every field below is from those pages; prices are micro-USD per million tokens. structured is json_schema because OpenRouter lists structured_outputs. Sampling is not written (the provider's defaults apply). licence: hosted only, the provider's terms.
id = "muse-spark-1.3-contributor"
label = "Muse Spark 1.3 (contributor)"
licence = { kind = "proprietary" }
family = "muse"
cold_start_estimate_s = 0
source = { kind = "hosted" }
vram = { weights_mib = 0, kv_per_1k_ctx_mib = 0, overhead_mib = 0 }
locality = { kind = "remote", v = { reach = [
  { provider = "openrouter", model = "meta/muse-spark-1.3-contributor", price = { input_per_mtok = 100000, output_per_mtok = 200000 }, wire = "open_ai_compat" },
] } }
inputs = ["text", "image"]
outputs = ["text"]
text_out = { tools = "native", structured = ["json_schema"], reasoning = "present", streaming = "present", context = 1048576, max_output = 943718 }
image_in = { per_prompt = 1, rule = { kind = "identity" }, space = { kind = "image" } }
