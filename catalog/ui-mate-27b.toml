# UI-Mate 27B (Tencent), a computer-use model on the Qwen3.6 27B dense base (Qwen3_5ForConditionalGeneration),
# BF16 checkpoint of 12 safetensors shards (about 55 GB, 27.4B parameters). Its chat template is the Qwen3.5 one:
# tools as qwen3_coder XML (`<tool_call><function=computer_use><parameter=action>..`), thinking on by default.
# Its reference agent (ui_mate_agent.py) speaks a variant of the Qwen `computer_use` function: the verbs
# `drag` (from the cursor to `coordinate`), `hotkey` and `press` (a `keys` array), `call_user` (`text`) and
# `finished` (a `status` of success or failure), and a `scroll` whose `direction` is vertical or horizontal.
# The `profile` below states exactly those differences, so the qwen_computer_use dialect reads and shows them.
# `key_down` and `key_up` (holding a key) are not in the profile: an action cannot say a hold, so they drop.
# - space: a 0-999 grid, so the top is 999 (the reference scales by 999). The prompt then says 999x999 where
#   the reference says 1000x1000.
# - image: smart_resize with factor 32, 56*56 to 16*16*4*12800 pixels, as the reference agent sizes it.
# - sampling: temperature 1.0 and top_p 0.95, the reference agent's, with reasoning on.
# - vram: an estimate, not a measurement. The checkpoint is about 55 GB; the engine line below takes three
#   quarters of a 96 GB card, so weights 52500 + 64 per 1k of the 16384 context (an assumed 16 full attention
#   layers of 4 KV heads of 256, as in the 9B Holo entry's base) + 11700 (activations, graphs, the engine's
#   reserve) is about 64 GB.
# - context: 16384, the window that line serves.
# - limits: context_max 262144 is text_config.max_position_embeddings in the pinned config.json (no reply limit stated). No context_min: its reference harness wants a context of 65536 and replies of 16384, but that is a harness need, not the model's; ours runs it at 16384.
id = "ui-mate-27b"
label = "UI-Mate 27B"
licence = { kind = "open", v = "Apache-2.0" }
family = "qwen"
cold_start_estimate_s = 240
source = { kind = "hugging_face", v = { repo = "tencent/UI-Mate-27B", revision = "3ade2378fc84032d5017c1a9c93c4eaa77d65e57" } }
vram = { weights_mib = 52500, kv_per_1k_ctx_mib = 64, overhead_mib = 11700 }
inputs = ["text", "image"]
outputs = ["text", "actions"]

[text_out]
tools = "server_parsed"
structured = ["json_schema"]
reasoning = "present"
streaming = "present"
context = 16384
max_output = 8192
context_max = 262144
sampling = { reasoning_on = { temperature = 1000, top_p = { kind = "set", v = 950 }, top_k = { kind = "off" }, min_p = { kind = "off" }, repeat_penalty = { kind = "off" }, seed = { kind = "off" } }, reasoning_off = { temperature = 0, top_p = { kind = "off" }, top_k = { kind = "off" }, min_p = { kind = "off" }, repeat_penalty = { kind = "off" }, seed = { kind = "off" } }, reasoning_default = "on" }

[image_in]
per_prompt = 3
rule = { kind = "smart_resize", v = { factor = 32, min_pixels = 3136, max_pixels = 13107200 } }
space = { kind = "grid", v = 999 }

[actions_out]
kind = "dialect"
v = { dialect = { kind = "tool", v = "qwen_computer_use" }, batching = "one", zoom = "absent", profile = { aliases = ["drag", "finished", "hotkey", "press", "call_user"], drag = "from_cursor", scroll = "by_direction" } }


# The line for fatcat GPU 1 (96 GB, shared); weights are the checkpoint's own BF16.
[[engine]]
kind = "vllm"
context_arg = { kind = "flag", v = "--max-model-len" }
args = [
  "--max-num-seqs", "4",
  "--limit-mm-per-prompt", "{\"image\":3,\"video\":0}",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "qwen3_coder",
  "--reasoning-parser", "qwen3",
  "--gpu-memory-utilization", "0.75",
]
weights = { kind = "hf_snapshot" }
