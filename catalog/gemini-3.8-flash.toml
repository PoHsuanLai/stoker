  { provider = "google-ai", model = "gemini-3.8-flash", wire = "open_ai_compat" },
  { provider = "openrouter", model = "google/gemini-3.8-flash", wire = "open_ai_compat" },
] } }
inputs = ["text", "image"]
outputs = ["text"]
text_out = { tools = "native", structured = ["json_schema"], reasoning = "present", streaming = "present", context = 1048576, max_output = 65536, context_max = 1048576, max_output_max = 65536 }
image_in = { per_prompt = 1, rule = { kind = "identity" }, space = { kind = "image" } }
