id = "kimi-k2.6"
label = "Kimi K2.6"
licence = { kind = "proprietary" }
family = "kimi"
cold_start_estimate_s = 0
source = { kind = "hosted" }
vram = { weights_mib = 0, kv_per_1k_ctx_mib = 0, overhead_mib = 0 }
locality = { kind = "remote", v = { reach = [
  { provider = "moonshot", model = "kimi-k2.6", price = { input_per_mtok = 950000, output_per_mtok = 4000000 }, wire = "open_ai_compat" },
  { provider = "openrouter", model = "moonshotai/kimi-k2.6", price = { input_per_mtok = 950000, output_per_mtok = 4000000 }, wire = "open_ai_compat" },
] } }
inputs = ["text", "image"]
outputs = ["text"]
text_out = { tools = "native", structured = [], reasoning = "present", streaming = "present", context = 262144, max_output = 32768 }
image_in = { per_prompt = 1, rule = { kind = "identity" }, space = { kind = "image" } }
