# Kimi K2.6, a hosted model reached through the providers below. Facts checked on 2026-10-06:
# - Moonshot: https://platform.kimi.ai/docs/guide/kimi-k2-6-quickstart and https://platform.kimi.ai/docs/pricing/chat, read 2026-10-06: id kimi-k2.6, 256K (262,144) context, 32,768 max output, image input, tool use, $0.95 / $4.00 per MTok; base URL https://api.moonshot.ai/v1. The page does not mention structured output, so none is claimed.
# - OpenRouter: https://openrouter.ai/api/v1/models listing, read 2026-10-06: id moonshotai/kimi-k2.6, context 262144, $0.00000095 / $0.000004 per token, tools listed (it lists a larger max completion, 235929; the smaller Moonshot figure is used).
# - every field below is from those pages; prices are micro-USD per million tokens.
# - image_in: the pages give no per-request image limits, so this claims one image, no resizing and the
#   image's own pixels as its space: a floor, not a limit. text_out: reasoning is on by default or selectable;
