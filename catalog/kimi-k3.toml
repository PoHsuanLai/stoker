# Kimi K3, a hosted model reached through the providers below. Facts checked on 2026-10-06:
# - Moonshot: https://platform.kimi.ai/docs/guide/kimi-k3-quickstart and https://platform.kimi.ai/docs/pricing/chat, read 2026-10-06: id kimi-k3, 1,048,576 context, vision input, tool calling, $3.00 / $15.00 per MTok; base URL https://api.moonshot.ai/v1 (OpenAI-compatible). Structured output (json_schema): https://platform.kimi.ai/docs/guide/response_format.
# - OpenRouter: https://openrouter.ai/api/v1/models listing, read 2026-10-06: id moonshotai/kimi-k3, context 1048576, max completion 943718, $0.00000095 / $0.000014 per token (not Moonshot's own price), tools and structured_outputs listed.
# - max_output is the smaller of the two figures (Moonshot allows up to the whole window; OpenRouter lists 943718).
# - every field below is from those pages; prices are micro-USD per million tokens.
# - image_in: the pages give no per-request image limits, so this claims one image, no resizing and the
#   image's own pixels as its space: a floor, not a limit. text_out: reasoning is on by default or selectable;
#   no sampling is written (the provider's defaults apply). licence: hosted only, the provider's terms.
id = "kimi-k3"
label = "Kimi K3"
licence = { kind = "proprietary" }
family = "kimi"
cold_start_estimate_s = 0
source = { kind = "hosted" }
vram = { weights_mib = 0, kv_per_1k_ctx_mib = 0, overhead_mib = 0 }
locality = { kind = "remote", v = { reach = [
  { provider = "moonshot", model = "kimi-k3", price = { input_per_mtok = 3000000, output_per_mtok = 15000000 }, wire = "open_ai_compat" },
  { provider = "openrouter", model = "moonshotai/kimi-k3", price = { input_per_mtok = 950000, output_per_mtok = 14000000 }, wire = "open_ai_compat" },
] } }
inputs = ["text", "image"]
outputs = ["text"]
text_out = { tools = "native", structured = ["json_schema"], reasoning = "present", streaming = "present", context = 1048576, max_output = 943718 }
image_in = { per_prompt = 1, rule = { kind = "identity" }, space = { kind = "image" } }
