# GPT-6 Luna, a hosted model reached through the providers below. Facts checked on 2026-10-06:
# - OpenAI: https://developers.openai.com/api/docs/models and .../models/gpt-6-luna, read 2026-10-06: id gpt-6-luna, 1,050,000 context, 128,000 max output, text and image in, text out, function calling and structured outputs; OpenAI calls it its most efficient model for high-volume tasks.
# - On Chat Completions the page says function calling works only with reasoning_effort set to none (the Responses API allows all levels): the caller must send that setting.
# - OpenRouter: https://openrouter.ai/api/v1/models listing, read 2026-10-06: id openai/gpt-6-luna, context 1050000, max completion 128000, tools and structured_outputs listed.
# - every field below is from those pages.
# - image_in: the pages give no per-request image limits, so this claims one image, no resizing and the
#   image's own pixels as its space: a floor, not a limit. text_out: reasoning is on by default or selectable;
#   no sampling is written (the provider's defaults apply). licence: hosted only, the provider's terms.
# - limits: context_max and max_output_max are the vendor's documented limits quoted above.
id = "gpt-6-luna"
label = "GPT-6 Luna"
licence = { kind = "proprietary" }
family = "gpt"
cold_start_estimate_s = 0
source = { kind = "hosted" }
vram = { weights_mib = 0, kv_per_1k_ctx_mib = 0, overhead_mib = 0 }
locality = { kind = "remote", v = { reach = [
  { provider = "openai", model = "gpt-6-luna", wire = "open_ai_compat" },
  { provider = "openrouter", model = "openai/gpt-6-luna", wire = "open_ai_compat" },
] } }
inputs = ["text", "image"]
outputs = ["text"]
text_out = { tools = "native", structured = ["json_schema"], reasoning = "present", streaming = "present", context = 1050000, max_output = 128000, context_max = 1050000, max_output_max = 128000 }
image_in = { per_prompt = 1, rule = { kind = "identity" }, space = { kind = "image" } }
