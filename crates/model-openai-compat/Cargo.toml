[package]
name = "model-openai-compat"
description = "The OpenAI-compatible chat-completions wire (llama-server, vLLM, LiteLLM, OpenRouter) as a model-wire codec, its quirk table, and the speech wire over model-http."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
model-provider = { workspace = true }
model-http = { workspace = true }
model-wire = { workspace = true }
speech-provider = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
model-http = { workspace = true, features = ["hyper"] }
tokio = { workspace = true, features = ["rt", "net", "io-util", "macros", "time"] }
model-replay = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
