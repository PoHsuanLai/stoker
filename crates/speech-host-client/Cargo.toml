[package]
name = "speech-host-client"
description = "The client of the speech-host engine process: a SpeechToText over its Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["net"]
# The socket client: the `SpeechToText` impl and the framing over a Unix stream. Off, the crate
# keeps its plain types (`HostSocket`, `SpeechHostClient`, `FrameBuffer`) and needs no runtime.
net = ["dep:tokio"]

[dependencies]
speech-provider = { workspace = true }
model-provider = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, optional = true, features = ["net", "io-util"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "net", "io-util"] }
speech-provider = { workspace = true, features = ["testing"] }

[lints]
workspace = true
