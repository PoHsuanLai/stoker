[package]
name = "model-http"
description = "HTTP for model endpoints over TCP, Unix sockets and TLS: targets, auth, pure SSE and NDJSON decoders, the client seam, and a reqwest client behind a feature."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The reqwest client behind `Transport for HttpClient`. Off by default so that the codecs (which
# depend on this crate for the seam types) reach no HTTP stack and no runtime; a daemon turns it
# on.
client = ["dep:reqwest", "dep:tokio"]
# TLS for `HttpTarget::Tls`: reqwest's rustls on the ring provider (installed here, never
# aws-lc), the platform's roots. Off by default (a consumer opts in); without it a `Tls` target
# answers `HttpError::Tls`.
tls = ["client", "reqwest/rustls-no-provider", "dep:rustls"]

[dependencies]
serde = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time", "macros"] }

[dev-dependencies]
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros"] }
serde_json = { workspace = true }

[lints]
workspace = true
