[package]
name = "engine-install"
description = "Gets an engine onto this computer from engine-manifest's pinned manifest: a resumable, cancellable download with its hash checked, unpacked and sealed into place; a Python environment filled from a hashed lock; or the distro's package. Also the argument grammar and the report lines of the privileged helper that installs for every user."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "engine-helper"
path = "src/bin/engine-helper.rs"

[dependencies]
engine-manifest = { workspace = true }
engine-probe = { workspace = true }
model-catalog = { workspace = true }
model-http = { workspace = true, features = ["client", "tls"] }
# The archives are unpacked in process (`extract`), never by the system's `tar`.
flate2 = { workspace = true }
tar = { workspace = true }
rustix = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }

[lints]
workspace = true
