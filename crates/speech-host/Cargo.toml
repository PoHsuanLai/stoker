# The protocol half of the speech-to-text engine process: argument parsing, the `Recognizer`
# seam and the host_wire serve loop. Pure std (blocking Unix sockets), so it is in the gate. The
# native engine is the sibling crate `speech-host-sherpa` (excluded; it links sherpa-onnx and
# carries the `speech-host` binary).
[package]
name = "speech-host"
description = "The speech-to-text engine process, protocol half: arguments, the Recognizer seam and the host_wire serve loop over a Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
speech-provider = { workspace = true }
model-provider = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
